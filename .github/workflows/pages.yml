name: Verify and deploy Pages
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run verify
      - name: Cache Godot
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-4.4.1-stable-linux-x86_64
      - name: Install Godot 4.4.1 (headless tests)
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot
          curl -fsSL -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d ~/godot
      - name: Game machine checks (story, headless acceptance, web pack in sync)
        env:
          GODOT: ~/godot/Godot_v4.4.1-stable_linux.x86_64
        run: |
          export GODOT="$HOME/godot/Godot_v4.4.1-stable_linux.x86_64"
          npm run verify:games
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: games-verification
          path: verification/games.json
      - name: Install browser acceptance tools
        run: |
          python -m pip install -r scripts/browser-requirements.txt
          python -m playwright install --with-deps chromium
      - name: Real-browser playground acceptance
        run: |
          npm run preview -- --port 4196 --strictPort > /tmp/playground-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4196/playground/ >/dev/null; then break; fi
            sleep 1
          done
          python scripts/verify-playground.py --url http://127.0.0.1:4196/playground/ --out verification/playground-ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playground-browser-evidence
          path: verification/playground-ci
      - name: Require committed reproducible assets
        run: |
          git diff --exit-code
          node --input-type=module -e "import fs from 'node:fs'; const b=JSON.parse(fs.readFileSync('dist/build-info.json')); if(b.dirty || b.sourceSha !== process.env.GITHUB_SHA) process.exit(1);"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: machine-verification
          path: verification/latest.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    if: github.event_name != 'pull_request'
    needs: verify-build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
