name: Verify and deploy Pages
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Cache Godot
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-4.4.1-stable-linux-x86_64
      - name: Install verification tools (Godot, Playwright)
        run: |
          echo "GODOT=$(.agents/skills/verify/scripts/install-godot.sh)" >> "$GITHUB_ENV"
          python -m pip install -r .agents/skills/verify/scripts/browser-requirements.txt
          python -m playwright install --with-deps chromium
      # All gates live in the /verify skill; run the same command locally before pushing.
      - run: npm run verify:ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification
          path: |
            verification/latest.json
            verification/games.json
            verification/playground-ci
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    if: github.event_name != 'pull_request'
    needs: verify-build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
