<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>纸鹤衔令 · 俯视技能动画</title><style>*{box-sizing:border-box}body{background:#102421;color:#e8e2cc;font-family:Georgia,'Songti SC',serif;margin:0}main{max-width:800px;margin:auto;padding:20px}h1{font-size:28px;font-weight:500}p{color:#b1c4b7;line-height:1.6}a{color:#d9bd80}canvas{display:block;width:100%;aspect-ratio:3/2;border:1px solid #426057}button,select{font:inherit;min-height:44px;background:#24483e;color:#eee7d0;border:1px solid #8d9b7b;padding:9px 18px;border-radius:4px}label{display:inline-flex;align-items:center;gap:8px;margin:8px}input[type=range]{width:min(320px,60vw)}.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #e6bd6e;outline-offset:3px}output{font-variant-numeric:tabular-nums}#status{min-height:26px}</style><main><a href="./#05-v2">← 概念评审</a><h1>纸鹤衔令 · 俯视技能动画</h1><p>折纸成鹤 → 分路绕行 → 展鹤为符 → 朱砂围合 → 纸角消散</p><canvas id="scene" width="960" height="640" aria-label="三只纸鹤展开成符的原创俯视技能动画"></canvas><p id="phase" aria-live="off">折纸成鹤</p><div class="bar"><button id="play">播放</button><button id="replay">从头播放</button><label>循环<input id="loop" type="checkbox" checked></label><label>速度<select id="speed"><option value="1">1×</option><option value="0.25">0.25×</option></select></label><output id="time">0.00s</output></div><label>时间<input id="seek" type="range" min="0" max="4.8" step="0.01" value="0"></label><label>精确时间<input id="exact" type="number" min="0" max="4.8" step="0.01" value="0" style="width:85px"></label><button id="sample">查看此帧</button><p>原创 Canvas 动作原型 · v0.2 · 仅一个局部技能范围，无山水大景。未绑定游戏命中；参考来自仓库的《一念逍遥》GIF，仅借鉴战斗视角和特效层级。</p><p><a href="./animations/paper-cranes-v0.2.gif" download>下载动画 GIF</a></p><p id="status"></p></main><script type="module">
import{drawCrane,duration,phase}from'./crane.js';const $=id=>document.getElementById(id),g=$('scene').getContext('2d');let t=0,playing=false,last=0;function render(){drawCrane(g,t);$('time').textContent=t.toFixed(2)+'s';$('phase').textContent=phase(t);$('seek').value=t;$('exact').value=t.toFixed(2)}function tick(now){if(playing){t+=(now-last)/1000*Number($('speed').value);if(t>=duration){if($('loop').checked)t%=duration;else{t=duration;playing=false;$('play').textContent='播放'}}render()}last=now;requestAnimationFrame(tick)}$('play').onclick=()=>{if(t>=duration)t=0;playing=!playing;last=performance.now();$('play').textContent=playing?'暂停':'播放'};$('replay').onclick=()=>{t=0;playing=true;last=performance.now();$('play').textContent='暂停';render()};function seek(v){playing=false;t=Math.max(0,Math.min(duration,Number(v)||0));$('play').textContent='播放';render()}$('seek').oninput=()=>seek($('seek').value);$('sample').onclick=()=>seek($('exact').value);document.addEventListener('visibilitychange',()=>{if(document.hidden){playing=false;$('play').textContent='播放'}});render();requestAnimationFrame(tick);
</script></html>
