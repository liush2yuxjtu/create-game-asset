<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>江湖 · 技能控制室</title><link rel="stylesheet" href="lab.css"></head><body><header><a href="../jianghu-sixteen/">← 江湖十六念</a><span>动作研究 / 02</span><a href="../jianghu-sixteen/animation.html">纸鹤原型 ↗</a></header><main><section class="intro"><div><p class="eyebrow">一处调整，各有分寸</p><h1>技能控制室<span>听雨借锋</span></h1><p>雨先停住，再借一瞬锋芒。两份独立实例，共用一套外部控制。</p></div><span class="badge">原创 2D · 俯视局部</span></section><div class="layout"><section class="stage"><div class="toolbar"><button id="play">播放</button><button id="restart">从头播放</button><label><input type="checkbox" id="loop" checked> 循环</label><button id="peak">查看穿透时刻</button></div><div id="cards" class="cards"></div><div class="timeline"><label for="seek">定位时间（同时采样两项）</label><input id="seek" type="range" min="0" max="4.2" step="0.01" value="1.8"><output id="time">1.80s</output></div><p class="hint">A 与 B 是同一技能的两个独立实例。单项覆盖优先于全局；“时间推进”只冻结所选实例，时间定位仍可直接查看。</p><details><summary>保存与交换配置</summary><p>仅保存本机浏览器设置，不写入 Airtable。导入只接受控制值，不执行代码。</p><div class="toolbar"><button id="export">导出 JSON</button><label class="upload">导入 JSON<input type="file" id="import" accept="application/json,.json"></label></div><textarea id="config" aria-label="配置 JSON" rows="5" placeholder="导出后可查看；也可粘贴配置并应用"></textarea><button id="apply">应用 JSON</button></details><p id="notice" role="status"></p></section><aside><div class="panel-title"><h2>控制范围</h2><button id="reset">重置全部</button></div><label class="scope">调整对象<select id="scope"><option value="global">全局 · 所有继承项</option><option value="rain-a">A · 听雨借锋</option><option value="rain-b">B · 听雨借锋</option></select></label><p id="scope-note"></p><button id="inherit" hidden>此资产全部恢复继承</button><div id="controls"></div></aside></div><footer>控制器适用于声明能力的新资产 · 现有纸鹤与青岚保持原样 · 未接入游戏命中</footer></main><script type="module" src="preview.js"></script></body></html>
